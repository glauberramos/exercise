<html>
  <head>
    <meta charset="UTF-8" />
    <title>Exercise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <meta name="application-name" content="Treino App" />
    <meta name="description" content="App para acompanhamento de treinos" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/icon-180x180.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="icons/icon-167x167.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />

    <link rel="stylesheet" href="styles.css" />

    <script src="exercises.js"></script>
    <script src="calendar.js"></script>

    <script>
      // Function to save input value to localStorage
      function saveToLocalStorage(id, value) {
        localStorage.setItem(id, value);
      }

      // Function to load saved values when page loads
      function loadSavedValues() {
        const inputs = document.querySelectorAll("input");

        inputs.forEach((input) => {
          const savedValue = localStorage.getItem(input.id);
          if (savedValue) {
            input.value = savedValue;
          }
        });
      }

      let selectedDate = null;
      let currentMonth = new Date().getMonth();
      let currentYear = new Date().getFullYear();

      function changeMonth(delta) {
        currentMonth += delta;

        // Handle year change
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        } else if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }

        renderCalendar();
      }

      function getMonthName(month) {
        const months = [
          "Janeiro",
          "Fevereiro",
          "Março",
          "Abril",
          "Maio",
          "Junho",
          "Julho",
          "Agosto",
          "Setembro",
          "Outubro",
          "Novembro",
          "Dezembro",
        ];
        return months[month];
      }

      function removeWorkout() {
        if (!selectedDate) return;

        localStorage.removeItem(`workout_${selectedDate}`);
        renderCalendar();

        // Reset workout buttons selection
        const buttons = document.querySelectorAll(".workout-button");
        buttons.forEach((button) => button.classList.remove("selected"));

        // Disable remove button
        updateRemoveButton();
      }

      function updateRemoveButton() {
        const removeButton = document.getElementById("removeWorkoutButton");
        const hasWorkout =
          selectedDate && localStorage.getItem(`workout_${selectedDate}`);

        removeButton.disabled = !hasWorkout;
      }

      function selectDate(date) {
        selectedDate = date;

        // Update remove button state
        updateRemoveButton();

        const buttons = document.querySelectorAll(".workout-button");
        const savedWorkout = localStorage.getItem(`workout_${date}`);
      }

      function selectWorkout(workout) {
        if (!selectedDate) return;

        localStorage.setItem(`workout_${selectedDate}`, workout);
        renderCalendar();

        // Update remove button state
        updateRemoveButton();
      }

      let selectedExercises = [];

      function openCreateWorkout() {
        const modal = document.getElementById("createWorkoutModal");
        modal.style.display = "flex";

        // Populate exercise select
        const select = document.getElementById("exerciseSelect");
        select.innerHTML = '<option value="">Selecione um exercício</option>';

        exercises.forEach((exercise) => {
          const option = document.createElement("option");
          option.value = exercise.name;
          option.textContent = exercise.name;
          select.appendChild(option);
        });
      }

      function closeCreateWorkout() {
        const modal = document.getElementById("createWorkoutModal");
        modal.style.display = "none";
        selectedExercises = [];
        document.getElementById("workoutName").value = "";
        document.getElementById("selectedExercises").innerHTML = "";
      }

      function addExerciseToWorkout() {
        const select = document.getElementById("exerciseSelect");
        const exerciseName = select.value;

        if (!exerciseName) return;

        const exercise = exercises.find((e) => e.name === exerciseName);
        if (exercise) {
          selectedExercises.push({
            name: exercise.name,
            gif: exercise.gif,
            id: exercise.id,
          });

          renderSelectedExercises();
        }
      }

      function removeExercise(index) {
        selectedExercises.splice(index, 1);
        renderSelectedExercises();
      }

      function renderSelectedExercises() {
        const container = document.getElementById("selectedExercises");
        container.innerHTML = selectedExercises
          .map(
            (exercise, index) => `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; background: #2d2d2d; border-radius: 5px;">
            <span>${exercise.name}</span>
            <button onclick="removeExercise(${index})" style="background: #cc3300; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">
              Remover
            </button>
          </div>
        `
          )
          .join("");
      }

      function saveWorkout() {
        const name = document.getElementById("workoutName").value;
        if (!name || selectedExercises.length === 0) {
          alert("Por favor, adicione um nome e pelo menos um exercício");
          return;
        }

        const workout = {
          name,
          exercises: selectedExercises,
        };

        // Get existing workouts or initialize empty array
        const existingWorkouts = JSON.parse(
          localStorage.getItem("customWorkouts") || "[]"
        );
        existingWorkouts.push(workout);
        localStorage.setItem(
          "customWorkouts",
          JSON.stringify(existingWorkouts)
        );

        closeCreateWorkout();
        displayCustomWorkouts();
      }

      function displayCustomWorkouts() {
        const workouts = JSON.parse(
          localStorage.getItem("customWorkouts") || "[]"
        );
        const container = document.getElementById("customWorkouts");

        if (workouts.length === 0) {
          container.innerHTML =
            "<p style='text-align: center; color: #888;'>Nenhum treino personalizado criado</p>";
          return;
        }

        container.innerHTML = workouts
          .map(
            (workout, index) => `
          <div style="margin-bottom: 20px; padding: 20px; background: #1e1e1e; border-radius: 10px;">
            <h3 style="margin-bottom: 15px;">${workout.name}</h3>
            <ul style="list-style: none; padding: 0;">
              ${workout.exercises
                .map(
                  (exercise) => `
                <li>
                  <div class="exercise-content">
                    <div class="input-wrapper">
                      <h3>${exercise.name}</h3>
                      <input
                        type="number"
                        id="${exercise.id}"
                        placeholder="Peso"
                        oninput="saveToLocalStorage(this.id, this.value)"
                      />
                    </div>
                    <img src="images/${exercise.gif}" loading="lazy" alt="${exercise.name}" />
                  </div>
                </li>
              `
                )
                .join("")}
            </ul>
            <button onclick="deleteWorkout(${index})" class="remove-workout-button" style="margin-top: 10px;">
              Excluir Treino
            </button>
            <button onclick="editWorkout(${index})" class="remove-workout-button" style="margin-top: 10px;">
              Editar Treino
            </button>
          </div>
        `
          )
          .join("");

        loadSavedValues();
      }

      function deleteWorkout(index) {
        if (!confirm("Tem certeza que deseja excluir este treino?")) return;

        const workouts = JSON.parse(
          localStorage.getItem("customWorkouts") || "[]"
        );
        workouts.splice(index, 1);
        localStorage.setItem("customWorkouts", JSON.stringify(workouts));
        displayCustomWorkouts();
      }

      // Call this when page loads
      document.addEventListener("DOMContentLoaded", displayCustomWorkouts);

      let editingWorkoutData = null;

      function editWorkout(index) {
        const modal = document.getElementById("editWorkoutModal");
        modal.style.display = "flex";

        // Populate exercise select
        const exerciseSelect = document.getElementById("editExerciseSelect");
        exerciseSelect.innerHTML =
          '<option value="">Selecione um exercício</option>';
        exercises.forEach((exercise) => {
          const option = document.createElement("option");
          option.value = exercise.name;
          option.textContent = exercise.name;
          exerciseSelect.appendChild(option);
        });

        loadWorkoutForEdit(index);
      }

      function loadWorkoutForEdit(index) {
        const workouts = JSON.parse(
          localStorage.getItem("customWorkouts") || "[]"
        );
        const selectedWorkout = workouts[index];

        if (selectedWorkout) {
          editingWorkoutData = { ...selectedWorkout };
          document.getElementById("editWorkoutContent").style.display = "block";
          renderEditExercises();
        } else {
          document.getElementById("editWorkoutContent").style.display = "none";
          editingWorkoutData = null;
        }
      }

      function renderEditExercises() {
        if (!editingWorkoutData) return;

        const container = document.getElementById("editExerciseList");
        container.innerHTML = editingWorkoutData.exercises
          .map(
            (exercise, index) => `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; background: #2d2d2d; border-radius: 5px;">
            <span>${exercise.name}</span>
            <button onclick="removeEditExercise(${index})" style="background: #cc3300; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">
              Remover
            </button>
          </div>
        `
          )
          .join("");
      }

      function addExerciseToEdit() {
        if (!editingWorkoutData) return;

        const select = document.getElementById("editExerciseSelect");
        const exerciseName = select.value;

        if (!exerciseName) return;

        const exercise = exercises.find((e) => e.name === exerciseName);
        if (exercise) {
          editingWorkoutData.exercises.push({
            name: exercise.name,
            gif: exercise.gif,
            id: exercise.id,
          });
          renderEditExercises();
        }
      }

      function removeEditExercise(index) {
        if (!editingWorkoutData) return;

        editingWorkoutData.exercises.splice(index, 1);
        renderEditExercises();
      }

      function saveEditedWorkout() {
        if (!editingWorkoutData) return;

        const workouts = JSON.parse(
          localStorage.getItem("customWorkouts") || "[]"
        );
        const index = workouts.findIndex((w) => w.id === editingWorkoutData.id);

        if (index === -1) {
          alert("Erro ao salvar alterações");
          return;
        }

        workouts[index] = editingWorkoutData;
        localStorage.setItem("customWorkouts", JSON.stringify(workouts));

        closeEditWorkout();
        displayCustomWorkouts();
      }

      function closeEditWorkout() {
        const modal = document.getElementById("editWorkoutModal");
        modal.style.display = "none";
        editingWorkoutData = null;
        document.getElementById("workoutSelect").value = "";
        document.getElementById("editWorkoutContent").style.display = "none";
        document.getElementById("editExerciseList").innerHTML = "";
      }
    </script>
  </head>
  <body onload="loadSavedValues()">
    <button class="calendar-button" onclick="openCalendar()">
      Abrir Calendário
    </button>

    <div id="calendarModal" class="modal">
      <div class="modal-content">
        <h3 class="modal-title">Calendário de Treinos</h3>
        <button class="close-button" onclick="closeCalendar()">&times;</button>

        <div class="calendar-nav">
          <button class="nav-button" onclick="changeMonth(-1)">
            <svg viewBox="0 0 24 24">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
            Anterior
          </button>
          <span id="monthTitle" class="month-title"></span>
          <button class="nav-button" onclick="changeMonth(1)">
            Próximo
            <svg viewBox="0 0 24 24">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
            </svg>
          </button>
        </div>

        <div class="calendar-header">
          <span>Dom</span>
          <span>Seg</span>
          <span>Ter</span>
          <span>Qua</span>
          <span>Qui</span>
          <span>Sex</span>
          <span>Sáb</span>
        </div>

        <div id="calendar" class="calendar"></div>

        <div class="workout-controls">
          <div class="workout-buttons">
            <div
              id="customWorkoutButtons"
              style="
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-top: 10px;
              "
            ></div>
          </div>
          <button
            id="removeWorkoutButton"
            class="remove-workout-button"
            onclick="removeWorkout()"
            disabled
          >
            Remover Treino
          </button>
        </div>
      </div>
    </div>
    <h2>Meus Treinos</h2>
    <button class="calendar-button" onclick="openCreateWorkout()">
      Criar Novo Treino
    </button>
    <div id="customWorkouts"></div>

    <div id="createWorkoutModal" class="modal">
      <div class="modal-content">
        <h3 class="modal-title">Criar Novo Treino</h3>
        <button class="close-button" onclick="closeCreateWorkout()">
          &times;
        </button>

        <div class="workout-form">
          <input
            type="text"
            id="workoutName"
            placeholder="Nome do Treino"
            style="margin-bottom: 20px"
          />

          <div class="exercise-selector">
            <select
              id="exerciseSelect"
              style="
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                background: #2d2d2d;
                color: white;
                border: 1px solid #444;
              "
            >
              <option value="">Selecione um exercício</option>
            </select>
            <button
              onclick="addExerciseToWorkout()"
              class="calendar-button"
              style="margin-bottom: 20px"
            >
              Adicionar Exercício
            </button>
          </div>

          <div id="selectedExercises" style="margin-bottom: 20px">
            <!-- Selected exercises will be listed here -->
          </div>

          <button onclick="saveWorkout()" class="calendar-button">
            Salvar Treino
          </button>
        </div>
      </div>
    </div>

    <div id="editWorkoutModal" class="modal">
      <div class="modal-content">
        <h3 class="modal-title">Editar Treino</h3>
        <button class="close-button" onclick="closeEditWorkout()">
          &times;
        </button>

        <div class="workout-form">
          <div id="editWorkoutContent" style="display: none">
            <div class="exercise-selector">
              <select
                id="editExerciseSelect"
                style="
                  width: 100%;
                  padding: 10px;
                  margin-bottom: 10px;
                  background: #2d2d2d;
                  color: white;
                  border: 1px solid #444;
                "
              >
                <option value="">Selecione um exercício</option>
              </select>
              <button
                onclick="addExerciseToEdit()"
                class="calendar-button"
                style="margin-bottom: 20px"
              >
                Adicionar Exercício
              </button>
            </div>

            <div id="editExerciseList" style="margin-bottom: 20px">
              <!-- Exercises will be listed here -->
            </div>

            <button onclick="saveEditedWorkout()" class="calendar-button">
              Salvar Alterações
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
